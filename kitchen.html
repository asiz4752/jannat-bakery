<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Jannat Bakery – Kitchen Display</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="tailwind-config.js"></script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="min-h-screen bg-brand-900 text-white">

  <!-- Sound enable overlay (browsers require a click before audio can play) -->
  <div id="sound-gate" class="fixed inset-0 z-[80] flex items-center justify-center p-4 bg-brand-900/90" style="background-image: linear-gradient(rgba(17, 24, 39, 0.72), rgba(17, 24, 39, 0.8)), url('Jannat%20Bakery.jpg'); background-size: cover; background-position: center; background-repeat: no-repeat;">
    <div class="text-center pop-in rounded-3xl border border-white/15 bg-black/35 backdrop-blur-sm px-8 py-7 shadow-2xl max-w-md w-full">
      <img src="Jannat%20Bakery.jpg" alt="Jannat Bakery logo" class="mx-auto h-20 w-20 object-cover rounded-full border-4 border-white/30 bg-white/90 shadow-lg mb-4" />
      <h1 class="font-display text-3xl mb-1 text-white">Kitchen Display</h1>
      <p class="text-brand-100 mb-5">Tap to start receiving orders with sound alerts</p>
      <button id="start-btn" class="btn-press bg-amber-400 text-brand-900 font-bold text-lg px-8 py-3 rounded-2xl shadow-xl">🔔 Start Kitchen Display</button>
    </div>
  </div>

  <header class="sticky top-0 z-30 bg-brand-800 shadow-lg">
    <div class="px-4 py-3 flex flex-wrap items-center gap-3">
      <div class="flex items-center gap-3">
        <img src="Jannat%20Bakery.jpg" alt="Jannat Bakery logo" class="h-10 w-10 object-cover rounded-full border-2 border-white/80 bg-white shadow-sm" />
        <h1 class="font-display text-xl">Kitchen <span class="text-brand-300 text-sm font-sans">Display System</span></h1>
      </div>
      <div id="counts" class="flex gap-2 text-sm"></div>
      <div class="ml-auto flex items-center gap-3 text-sm">
        <span id="clock" class="font-mono text-brand-200"></span>
        <button id="mute-btn" class="btn-press px-3 py-1.5 rounded-lg bg-white/10 hover:bg-white/20">🔔 Sound On</button>
        <button id="test-sound" class="btn-press px-3 py-1.5 rounded-lg bg-white/10 hover:bg-white/20">Test</button>
        <a href="admin.html" class="px-3 py-1.5 rounded-lg bg-white/10 hover:bg-white/20">Admin</a>
      </div>
    </div>
  </header>

  <main class="p-4 grid gap-4 md:grid-cols-3">
    <section>
      <h2 class="flex items-center gap-2 font-bold text-amber-300 mb-3">🕒 PENDING <span id="n-pending" class="bg-amber-400 text-brand-900 rounded-full px-2 text-sm">0</span></h2>
      <div id="col-pending" class="space-y-3"></div>
    </section>
    <section>
      <h2 class="flex items-center gap-2 font-bold text-blue-300 mb-3">🔥 PREPARING <span id="n-preparing" class="bg-blue-400 text-brand-900 rounded-full px-2 text-sm">0</span></h2>
      <div id="col-preparing" class="space-y-3"></div>
    </section>
    <section>
      <h2 class="flex items-center gap-2 font-bold text-green-300 mb-3">✅ READY TO SERVE <span id="n-ready" class="bg-green-400 text-brand-900 rounded-full px-2 text-sm">0</span></h2>
      <div id="col-ready" class="space-y-3"></div>
    </section>
  </main>

  <script type="module" src="kitchen.js"></script>
</body>
</html>
